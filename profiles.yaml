# 2026-08-18: NVIDIA connectors drifted again (DP-3→DP-1, HDMI-A-3→HDMI-A-1).
primary_monitor: DP-1
safe_workspace: 1
profile_order:
  - dual_sdr
  - single_left_sdr
  - single_left_hdr

profiles:
  dual_sdr:
    label: Dual — SDR (both 4K144 8-bit)
    monitors:
      - DP-1,3840x2160@144,0x0,1.5,vrr,2,bitdepth,8,cm,srgb
      - HDMI-A-1,3840x2160@144,2560x0,1.5,vrr,2,bitdepth,8,cm,srgb
  single_left_sdr:
    label: Single — left SDR (right off)
    monitors:
      - DP-1,3840x2160@144,0x0,1.5,bitdepth,10,cm,srgb
      - HDMI-A-1,disable
  single_left_hdr:
    label: Single — left HDR (right off)
    monitors:
      - DP-1,3840x2160@144,0x0,1.5,bitdepth,10,cm,hdr
      - HDMI-A-1,disable
